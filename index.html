html<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ナチュラル教務手帳 Pro</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        .leather-cover { background-color: #1b4332; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 0); background-size: 4px 4px; box-shadow: inset 0 0 40px rgba(0,0,0,0.6); }
        .notebook-spine { box-shadow: 10px 0 15px -5px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen font-sans">

    <!-- 1枚目：表紙画面 -->
    <div id="coverScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-stone-900 p-4 transition-all duration-300">
        <div class="w-full max-w-md h-[550px] leather-cover rounded-2xl relative flex flex-col justify-between p-8 border-2 border-emerald-900 shadow-2xl overflow-hidden">
            <div class="absolute left-0 top-0 bottom-0 w-5 bg-emerald-950/40 notebook-spine border-r border-emerald-950/20"></div>
            <div class="absolute inset-2 border border-dashed border-emerald-600/30 rounded-xl pointer-events-none"></div>
            <div class="text-center mt-6">
                <span class="text-xs tracking-widest text-emerald-400 font-bold block mb-2">✦ OFFICIAL ACADEMIC NOTE ✦</span>
                <div class="h-0.5 bg-emerald-700/50 w-24 mx-auto"></div>
            </div>
            <div class="text-center bg-emerald-950/40 border border-amber-500/20 p-6 rounded-xl mx-4 shadow-inner backdrop-blur-sm">
                <h2 class="text-2xl font-serif font-bold tracking-wider text-amber-200">TEACHER'S</h2>
                <h3 class="text-xl font-serif font-bold tracking-widest text-amber-200 mt-1">PLANNER</h3>
                <p class="text-[10px] text-stone-400 mt-4 tracking-widest" id="coverDate">DAILY HANDBOOK</p>
            </div>
            <div class="text-center mb-6 z-10">
                <button onclick="openNotebook()" class="px-8 py-3 bg-amber-200 hover:bg-amber-100 text-emerald-950 font-bold text-sm tracking-widest rounded-full shadow-lg transition-all duration-300">手帳を開く 📖</button>
                <p class="text-[11px] text-emerald-300/60 mt-3">完全オフライン環境・安全動作中</p>
            </div>
        </div>
    </div>

    <!-- 2枚目：週案スケジュール画面 -->
    <div id="mainContent" class="hidden opacity-0 transition-opacity duration-300">
        <header class="bg-emerald-700 text-white p-4 shadow-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="flex items-center gap-3">
                    <button onclick="closeNotebook()" class="text-xs bg-emerald-800 hover:bg-emerald-600 px-3 py-1.5 rounded-lg border border-emerald-600 transition">📁 表紙を閉じる</button>
                    <h1 class="text-lg font-bold flex items-center gap-1">🌿 教務手帳</h1>
                </div>
                <div class="flex items-center gap-2 bg-emerald-800 p-1.5 rounded-lg shadow-inner">
                    <button onclick="moveWeek(-1)" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 rounded text-sm font-bold transition">◀ 前の週</button>
                    <span id="weekLabel" class="text-sm font-bold px-2 text-center text-amber-200 min-w-[150px]">----年--月--日の週</span>
                    <button onclick="moveWeek(1)" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 rounded text-sm font-bold transition">次の週 ▶</button>
                </div>
            </div>
        </header>
        <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                <h2 class="text-lg font-bold text-emerald-800 mb-4 flex items-center gap-2">📅 週間スケジュール（週案）</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm border-collapse min-w-[600px]">
                        <thead>
                            <tr class="bg-emerald-50 border-b-2 border-emerald-200">
                                <th class="p-2.5 text-center w-16 text-emerald-700 font-bold">校時</th>
                                <th class="p-2.5 border-l border-emerald-100 text-center font-bold text-red-600" id="date-mon">月(--/--)</th>
                                <th class="p-2.5 border-l border-emerald-100 text-center font-bold text-emerald-800" id="date-tue">火(--/--)</th>
                                <th class="p-2.5 border-l border-emerald-100 text-center font-bold text-emerald-800" id="date-wed">水(--/--)</th>
                                <th class="p-2.5 border-l border-emerald-100 text-center font-bold text-emerald-800" id="date-thu">木(--/--)</th>
                                <th class="p-2.5 border-l border-emerald-100 text-center font-bold text-blue-600" id="date-fri">金(--/--)</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="space-y-6">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                    <h2 class="text-lg font-bold text-emerald-800 mb-3 flex items-center gap-2">✅ 今週のタスク（ToDo）</h2>
                    <textarea id="todo-list" class="w-full h-44 p-3 text-sm border border-stone-200 rounded-lg resize-none bg-stone-50/30 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="・宿紙の回収状況チェック..." oninput="handleInput('todo-list', this.value)"></textarea>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                    <h2 class="text-lg font-bold text-emerald-800 mb-3 flex items-center gap-2">📝 自由連絡メモ</h2>
                    <textarea id="free-memo" class="w-full h-44 p-3 text-sm border border-stone-200 rounded-lg resize-none bg-stone-50/30 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="連絡事項やメモ..." oninput="handleInput('free-memo', this.value)"></textarea>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentMonday = new Date();
        
        // 今週の月曜日を計算する関数
        function initMonday() {
            const dayOfWeek = currentMonday.getDay();
            const distanceToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            currentMonday.setDate(currentMonday.getDate() + distanceToMonday);
        }

        window.onload = function() {
            initMonday();
            const today = new Date();
            document.getElementById('coverDate').innerText = today.getFullYear() + "年 " + (today.getMonth() + 1) + "月 " + today.getDate() + "日";
            
            const savedDateStr = localStorage.getItem('last_saved_monday');
            if (savedDateStr) { currentMonday = new Date(savedDateStr); }
            
            buildTable(); 
            updateCalendarAndData();
            if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
        };

        function buildTable() {
            const tbody = document.getElementById('tableBody'); 
            tbody.innerHTML = '';
            const daysKey = ['mon', 'tue', 'wed', 'thu', 'fri'];
            for (let p = 1; p <= 6; p++) {
                let tr = document.createElement('tr'); 
                tr.className = 'border-b hover:bg-stone-50/50';
                let tdLabel = document.createElement('td'); 
                tdLabel.className = 'p-3 font-bold text-center bg-stone-50 text-stone-500 border-r';
                tdLabel.innerText = p + "限"; 
                tr.appendChild(tdLabel);
                
                daysKey.forEach(day => {
                    let td = document.createElement('td'); 
                    td.className = 'p-1.5 border-r';
                    let ta = document.createElement('textarea'); 
                    ta.id = "plan-" + day + "-" + p;
                    ta.className = 'w-full h-20 p-2 text-xs border rounded-lg resize-none bg-stone-50/30 focus:outline-none focus:ring-2 focus:ring-emerald-500';
                    ta.placeholder = '授業内容...'; 
                    ta.oninput = function() { handleInput(ta.id, ta.value) };
                    td.appendChild(ta); 
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            }
        }

        document.write = function() {}; // 安全対策

        function openNotebook() { 
            document.getElementById('coverScreen').classList.add('opacity-0', 'pointer-events-none'); 
            const main = document.getElementById('mainContent'); 
            main.classList.remove('hidden'); 
            setTimeout(function() { main.classList.add('opacity-100'); }, 50); 
        }
        function closeNotebook() { 
            document.getElementById('mainContent').classList.remove('opacity-100'); 
            document.getElementById('mainContent').classList.add('hidden'); 
            document.getElementById('coverScreen').classList.remove('opacity-0', 'pointer-events-none'); 
        }

        function updateCalendarAndData() {
            const year = currentMonday.getFullYear(); 
            const month = currentMonday.getMonth() + 1; 
            const date = currentMonday.getDate();
            document.getElementById('weekLabel').innerText = year + "年" + month + "月" + date + "日の週";
            localStorage.setItem('last_saved_monday', currentMonday.toDateString());
            
            const daysKey = ['mon', 'tue', 'wed', 'thu', 'fri']; 
            const dayNames = ['月', '火', '水', '木', '金'];
            
            daysKey.forEach(function(day, index) {
                const targetDay = new Date(currentMonday); 
                targetDay.setDate(currentMonday.getDate() + index);
